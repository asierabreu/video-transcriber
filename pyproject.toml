[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "video-transcriber"
version = "1.0.0"
description = "Self-hosted video transcription with local Whisper, speaker diarization and LLM post-processing."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Video Transcriber contributors" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.18",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "python-json-logger>=2.0.7",
    "python-ulid>=2.7",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Heavy ML stack, needed by the worker and the model download script only.
ml = [
    "faster-whisper==1.2.1",
    "pyannote.audio==4.0.7",
    "torch>=2.6",
    "numpy>=1.26",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
    "honcho>=2.0",
    "pip-licenses>=5.0",
]

[project.scripts]
transcriber-api = "transcriber.api.main:run"
transcriber-worker = "transcriber.worker.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/transcriber"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "e2e: full stack with real models (opt-in: pytest -m e2e)",
    "integration: needs ffmpeg/ffprobe on PATH",
]
addopts = "-m 'not e2e'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
packages = ["transcriber"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["transcriber.pipeline.*", "transcriber.llm.*", "transcriber.formats.*"]
disallow_untyped_defs = true
